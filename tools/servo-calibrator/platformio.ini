; Standalone MG90S pulse calibrator for a classic ESP32 dev board.
; This project is not part of Rocky's firmware build.

[env:servo-calibrator]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
; CH340C clones often fail at the default 921600 upload baud.
upload_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0
lib_deps = madhephaestus/ESP32Servo@3.2.1
