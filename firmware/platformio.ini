[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
# CORE_DEBUG_LEVEL=0 quiets the core's "connection reset" spam while the
# brain server is down.
# Diagnostic build. CAMERA_ENABLED=0 skips the camera. MIC_ENABLED=0 skips
# PDM capture and microphone uplink. LOOP_TIMING=1 prints where each loop
# spent its time. Set a flag to 1 (or 0 for timing) to restore that part.
# This is not the camera-on-demand design.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCAMERA_ENABLED=0
    -DMIC_ENABLED=0
    -DLOOP_TIMING=1
extra_scripts = pre:scripts/patch_ws_read_probe.py
lib_deps =
    olikraus/U8g2@^2.35.19
    madhephaestus/ESP32Servo@^3.0.5
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.0.0
