[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
# CORE_DEBUG_LEVEL=0 quiets the core's "connection reset" spam while the
# brain server is down.
# Normal build. CAMERA_ENABLED=0 leaves the camera off. MIC_ENABLED=1
# streams the microphone. LOOP_TIMING=0 keeps the serial log to connections,
# commands, and the once-per-utterance speech summary. Set LOOP_TIMING=1 to
# restore the 2 s loop/net lines, microphone sent/busy counters, slow-loop
# warnings, and the one-shot Wi-Fi power-save readback. The WebSocket read
# probe stays installed and does not record while LOOP_TIMING is 0.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DCAMERA_ENABLED=0
    -DMIC_ENABLED=1
    -DLOOP_TIMING=0
extra_scripts = pre:scripts/patch_ws_read_probe.py
lib_deps =
    olikraus/U8g2@^2.35.19
    madhephaestus/ESP32Servo@^3.0.5
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.0.0
